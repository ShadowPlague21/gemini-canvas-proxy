<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Gemini Canvas Proxy</title>
    <style>
        /* System font stack only — no Google Fonts (saves network + memory) */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #080a0f;
            --surface: #0f1218;
            --surface-2: #161b24;
            --border: rgba(255, 255, 255, 0.06);
            --border-bright: rgba(255, 255, 255, 0.12);
            --text: #e8edf5;
            --text-secondary: #7a8599;
            --text-dim: #4a5568;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.12);
            --accent-soft: rgba(99, 102, 241, 0.08);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.15);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.15);
            --yellow: #f59e0b;
            --yellow-glow: rgba(245, 158, 11, 0.12);
            --radius: 14px;
            --radius-sm: 10px;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 680px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* ── Header ───────────────────────────────────────────── */

        .header {
            margin-bottom: 20px;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .header p {
            font-size: 0.76rem;
            color: var(--text-secondary);
            margin-left: 48px;
        }

        /* ── Status Bar ───────────────────────────────────────── */

        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 14px;
            transition: border-color 0.3s;
        }

        .status-bar.online { border-color: rgba(16, 185, 129, 0.3); }
        .status-bar.offline { border-color: rgba(239, 68, 68, 0.3); }
        .status-bar.waiting { border-color: rgba(245, 158, 11, 0.3); }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: var(--green);
            box-shadow: 0 0 8px var(--green), 0 0 20px var(--green-glow);
        }

        .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red-glow); }

        .status-dot.waiting {
            background: var(--yellow);
            box-shadow: 0 0 8px var(--yellow-glow);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .status-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
        }

        .status-badge {
            margin-left: auto;
            font-size: 0.65rem;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.02em;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
        }

        .status-badge.active {
            background: var(--green-glow);
            color: var(--green);
        }

        .status-badge.inactive {
            background: var(--red-glow);
            color: var(--red);
        }

        /* ── Stats ────────────────────────────────────────────── */

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            line-height: 1;
        }

        .stat-value.default { color: var(--accent); }
        .stat-value.success { color: var(--green); }
        .stat-value.error { color: var(--red); }

        .stat-label {
            font-size: 0.6rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            font-weight: 500;
        }

        /* ── Log Card & Header ───────────────────────────────── */

        .log-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
        }

        .log-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-header-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .log-header-count {
            font-size: 0.65rem;
            color: var(--text-dim);
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
        }

        .log-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sm {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-bright);
            color: var(--text-secondary);
            font-size: 0.62rem;
            padding: 3px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-sm:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .btn-sm.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Log Container (100 Entries Max) ──────────────────── */

        .log-container {
            max-height: 420px;
            overflow-y: auto;
            padding: 4px 0;
        }

        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: transparent; }
        .log-container::-webkit-scrollbar-thumb {
            background: var(--border-bright);
            border-radius: 3px;
        }

        .log-entry {
            display: flex;
            flex-direction: column;
            padding: 8px 14px;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.7rem;
            line-height: 1.4;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: background 0.15s;
        }

        .log-entry:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .log-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-time {
            color: var(--text-dim);
            flex-shrink: 0;
            font-size: 0.62rem;
            min-width: 54px;
        }

        .log-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .log-indicator.request { background: var(--accent); }
        .log-indicator.success { background: var(--green); }
        .log-indicator.error { background: var(--red); box-shadow: 0 0 6px var(--red-glow); }
        .log-indicator.info { background: var(--text-dim); }

        .log-text {
            color: var(--text);
            word-break: break-all;
            flex: 1;
        }

        .log-text.success { color: var(--green); }
        .log-text.error { color: var(--red); font-weight: 600; }
        .log-text.info { color: var(--text-secondary); }

        /* ── Verbose Error Inspector Box ───────────────────────── */

        .log-details-box {
            margin-top: 6px;
            margin-left: 64px;
            padding: 10px 12px;
            background: rgba(15, 18, 24, 0.95);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.66rem;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            overflow-x: auto;
        }

        .log-entry.has-details.expanded .log-details-box,
        .log-entry.is-error.verbose-always .log-details-box {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-dim);
        }

        .empty-state-icon {
            font-size: 2rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .empty-state-hint {
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-top: 6px;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
        }

        /* ── Footer ───────────────────────────────────────────── */

        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 0.62rem;
            color: var(--text-dim);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-row">
                <div class="header-icon">⚡</div>
                <h1>Gemini Canvas Proxy</h1>
            </div>
            <p>Free unlimited Gemini API via Canvas postMessage bridge</p>
        </div>

        <div id="status-bar" class="status-bar waiting">
            <div id="status-dot" class="status-dot waiting"></div>
            <span id="status-label" class="status-label">Connecting...</span>
            <span id="status-badge" class="status-badge inactive">WAITING</span>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div id="stat-total" class="stat-value default">0</div>
                <div class="stat-label">Requests</div>
            </div>
            <div class="stat-card">
                <div id="stat-success" class="stat-value success">0</div>
                <div class="stat-label">Success</div>
            </div>
            <div class="stat-card">
                <div id="stat-errors" class="stat-value error">0</div>
                <div class="stat-label">Errors</div>
            </div>
        </div>

        <div class="log-card">
            <div class="log-header">
                <div class="log-header-left">
                    <span class="log-header-title">Activity Log</span>
                    <span id="log-header-count" class="log-header-count">0 / 100 entries</span>
                </div>
                <div class="log-controls">
                    <button id="btn-verbose" class="btn-sm active" onclick="toggleVerboseMode()">Verbose Errors: ON</button>
                    <button id="btn-clear" class="btn-sm" onclick="clearLogs()">Clear</button>
                </div>
            </div>
            <div id="log-container" class="log-container">
                <div id="empty-state" class="empty-state">
                    <div class="empty-state-icon">📡</div>
                    <div class="empty-state-text">Waiting for requests</div>
                    <div class="empty-state-hint">curl http://127.0.0.1:8765/v1/chat/completions</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <a href="https://github.com/ShadowPlague21/gemini-canvas-proxy" target="_blank">gemini-canvas-proxy</a> · postMessage bridge · 100 Verbose Logs
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // CANVAS AUTO-INJECT — Canvas replaces the empty string with
        // the real API key at compile time. DO NOT modify this line.
        // ═══════════════════════════════════════════════════════════════
        const apiKey = "";

        var statusState = 'waiting';
        var stats = { total: 0, success: 0, errors: 0 };
        var logsCount = 0;
        var MAX_LOG_ENTRIES = 100; // Increased log limit to 100 entries
        var verboseErrorsMode = true;
        var SEEN_TTL_MS = 30000;
        var SEEN_MAX = 200;
        var seenRequests = new Map();
        var scrollPending = false;

        function markSeen(id) {
            if (seenRequests.has(id)) {
                seenRequests.delete(id);
            }
            seenRequests.set(id, Date.now());
            while (seenRequests.size > SEEN_MAX) {
                var oldest = seenRequests.keys().next().value;
                seenRequests.delete(oldest);
            }
        }

        function wasSeen(id) {
            if (!seenRequests.has(id)) return false;
            var t = seenRequests.get(id);
            if (Date.now() - t > SEEN_TTL_MS) {
                seenRequests.delete(id);
                return false;
            }
            return true;
        }

        setInterval(function() {
            var now = Date.now();
            seenRequests.forEach(function(ts, key) {
                if (now - ts > SEEN_TTL_MS) seenRequests.delete(key);
            });
        }, 30000);

        function updateStatus(newStatus) {
            var bar = document.getElementById('status-bar');
            var dot = document.getElementById('status-dot');
            var label = document.getElementById('status-label');
            var badge = document.getElementById('status-badge');
            
            statusState = newStatus;
            bar.className = 'status-bar ' + newStatus;
            dot.className = 'status-dot ' + newStatus;
            
            if (newStatus === 'waiting') {
                label.innerText = 'Connecting...';
                badge.innerText = 'WAITING';
                badge.className = 'status-badge inactive';
            } else if (newStatus === 'online') {
                label.innerText = 'Proxy Active';
                badge.innerText = 'LIVE';
                badge.className = 'status-badge active';
            } else {
                label.innerText = 'Disconnected';
                badge.innerText = 'OFFLINE';
                badge.className = 'status-badge inactive';
            }
        }

        function scheduleScrollBottom(container) {
            if (scrollPending) return;
            scrollPending = true;
            requestAnimationFrame(function() {
                scrollPending = false;
                container.scrollTop = container.scrollHeight;
            });
        }

        function toggleVerboseMode() {
            verboseErrorsMode = !verboseErrorsMode;
            var btn = document.getElementById('btn-verbose');
            btn.innerText = 'Verbose Errors: ' + (verboseErrorsMode ? 'ON' : 'OFF');
            btn.className = 'btn-sm ' + (verboseErrorsMode ? 'active' : '');
            
            // Toggle verbose class on log entries
            var container = document.getElementById('log-container');
            var entries = container.getElementsByClassName('log-entry');
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].classList.contains('is-error')) {
                    if (verboseErrorsMode) entries[i].classList.add('verbose-always');
                    else entries[i].classList.remove('verbose-always');
                }
            }
        }

        function clearLogs() {
            var container = document.getElementById('log-container');
            container.innerHTML = '';
            logsCount = 0;
            document.getElementById('log-header-count').innerText = '0 / 100 entries';
            
            var emptyState = document.createElement('div');
            emptyState.id = 'empty-state';
            emptyState.className = 'empty-state';
            emptyState.innerHTML = '<div class="empty-state-icon">📡</div><div class="empty-state-text">Waiting for requests</div><div class="empty-state-hint">curl http://127.0.0.1:8765/v1/chat/completions</div>';
            container.appendChild(emptyState);
        }

        function addLog(indicator, text, type, verboseDetails) {
            type = type || 'info';
            var container = document.getElementById('log-container');
            var emptyState = document.getElementById('empty-state');
            if (emptyState) {
                emptyState.remove();
            }
            
            var time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            var logEntry = document.createElement('div');
            logEntry.className = 'log-entry ' + (type === 'error' ? 'is-error ' + (verboseErrorsMode ? 'verbose-always' : '') : '');
            
            var row = document.createElement('div');
            row.className = 'log-row';
            
            var tEl = document.createElement('span');
            tEl.className = 'log-time';
            tEl.textContent = time;
            
            var iEl = document.createElement('span');
            iEl.className = 'log-indicator ' + indicator;
            
            var xEl = document.createElement('span');
            xEl.className = 'log-text ' + type;
            xEl.textContent = text;
            
            row.appendChild(tEl);
            row.appendChild(iEl);
            row.appendChild(xEl);
            logEntry.appendChild(row);

            if (verboseDetails) {
                logEntry.classList.add('has-details');
                var detailsBox = document.createElement('div');
                detailsBox.className = 'log-details-box';
                detailsBox.textContent = typeof verboseDetails === 'object' ? JSON.stringify(verboseDetails, null, 2) : String(verboseDetails);
                logEntry.appendChild(detailsBox);
                
                logEntry.onclick = function() {
                    logEntry.classList.toggle('expanded');
                };
            }

            container.appendChild(logEntry);
            logsCount++;

            // Cap DOM log nodes to 100 entries max
            while (container.children.length > MAX_LOG_ENTRIES) {
                container.removeChild(container.firstChild);
            }

            document.getElementById('log-header-count').innerText =
                Math.min(logsCount, MAX_LOG_ENTRIES) + ' / 100 entries' +
                (logsCount > MAX_LOG_ENTRIES ? ' (capped)' : '');
            
            scheduleScrollBottom(container);
            
            // Stats handling
            if (type === 'success') {
                stats.total++;
                stats.success++;
            } else if (type === 'error') {
                stats.total++;
                stats.errors++;
            }
            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-success').innerText = stats.success;
            document.getElementById('stat-errors').innerText = stats.errors;
        }

        // Ready trigger
        setTimeout(function() {
            window.parent.postMessage({ source: 'gemini-proxy-ready' }, '*');
            updateStatus('online');
            addLog('info', 'Proxy ready — 100 verbose logs active', 'info');
        }, 500);

        window.addEventListener('message', function(event) {
            var data = event.data;
            if (!data || data.source !== 'gemini-proxy-request') return;

            var id = data.id;
            if (wasSeen(id)) return;
            markSeen(id);

            var method = data.method || 'POST';
            var path = data.path;
            var body = data.body;
            var headers = data.headers;
            
            var displayPath = path.replace('/v1beta/models/', '').replace(':generateContent', '');
            addLog('request', method + ' ' + displayPath);

            var url = 'https://generativelanguage.googleapis.com' + path;
            if (apiKey) {
                url += (url.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(apiKey);
            }

            function executeFetch(retryCount) {
                retryCount = retryCount || 0;
                fetch(url, {
                    method: method,
                    headers: Object.assign({ 'Content-Type': 'application/json' }, headers || {}),
                    body: body ? JSON.stringify(body) : undefined
                }).then(function(response) {
                    return response.text().then(function(text) {
                        var respData;
                        try {
                            respData = JSON.parse(text);
                        } catch (e) {
                            respData = { rawText: text ? text.substring(0, 1500) : 'Empty response body' };
                        }

                        // Multi-attempt auto-retry on transient 401/429 rate limits (up to 3 retries)
                        if (!response.ok && (response.status === 401 || response.status === 429) && retryCount < 3) {
                            var delay = (retryCount + 1) * 1500;
                            addLog('info', 'Retrying request (attempt ' + (retryCount + 1) + '/3) in ' + (delay / 1000) + 's after ' + response.status + '...', 'info');
                            setTimeout(function() { executeFetch(retryCount + 1); }, delay);
                            return;
                        }

                        if (response.ok) {
                            addLog('success', response.status + ' OK — ' + displayPath, 'success');
                        } else {
                            var errorSummary = response.status + ' ' + (response.statusText || 'API Error') + ' [' + displayPath + ']';
                            var verbosePayload = {
                                status: response.status,
                                statusText: response.statusText,
                                endpoint: path,
                                targetModel: displayPath,
                                geminiApiResponse: respData
                            };
                            addLog('error', errorSummary, 'error', verbosePayload);
                        }

                        window.parent.postMessage({
                            source: 'gemini-proxy-response',
                            id: id,
                            status: response.status,
                            data: respData,
                            error: response.ok ? null : 'API ' + response.status
                        }, '*');
                    });
                }).catch(function(err) {
                    if (retryCount < 3) {
                        var delay = (retryCount + 1) * 1500;
                        setTimeout(function() { executeFetch(retryCount + 1); }, delay);
                        return;
                    }
                    var netErrorPayload = {
                        error: err.message,
                        stack: err.stack,
                        endpoint: path,
                        targetModel: displayPath
                    };
                    addLog('error', 'Network/Fetch Failure: ' + err.message, 'error', netErrorPayload);
                    window.parent.postMessage({ source: 'gemini-proxy-response', id: id, error: err.message }, '*');
                });
            }

            executeFetch(0);
        });
    </script>
</body>
</html>
